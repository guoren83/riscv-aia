<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440">
  <title>Ssaiamrifd guest and S-file MRIF delivery</title>
  <desc>The IOMMU atomically sets a device interrupt's pending bit in the
    coherent guest MRIF, then sends a notice MSI to the target hart's S-file.
    The IMSIC matches the notice against the committed guest context G1.
    A match consumes the notice and starts independent query and signaling
    paths. The query reads block 0 to obtain MAXBLK, scans blocks 0 through
    MAXBLK, and selects the highest-priority eligible interrupt for vstopei.
    The signaling path independently checks for eligible pending interrupts
    and updates hgeip bit 1 without waiting for the query. Existing delivery
    controls select VS external or HS guest external interrupt signaling.
    Unmatched notices follow the ordinary S-file MSI path with EIID equal
    to NID. Matching is independent of the currently selected VGEIN.
    In the S-file path, S.eimrifcfg.EN selects native or MRIF backing.
    With MRIF backing, the IMSIC AMOORs EIP for EIID at least 2 in its own
    S-file MRIF, waits until the update is visible to subsequent reads,
    then reads block 0 and MAXBLK. Within that bound, it starts parallel
    stopei query and SEIP signaling refreshes. S-file signaling does not
    wait for priority selection. Identity 0 and unsupported identities
    are ignored; MRIF backing also ignores identity 1.</desc>
  <rect width="1200" height="1440" fill="white"/>

  <g stroke="black" stroke-width="2" fill="white">
    <rect x="20" y="80" width="155" height="90"/>
    <rect x="310" y="70" width="165" height="125"/>
    <rect x="790" y="25" width="390" height="205"/>
    <rect x="845" y="90" width="290" height="85" stroke-dasharray="5 6"/>

    <!-- Notice matching and both refresh engines reside in the IMSIC. -->
    <rect x="20" y="285" width="1160" height="345"/>
    <rect x="335" y="345" width="680" height="80"/>
    <rect x="40" y="480" width="210" height="120"/>
    <rect x="335" y="480" width="330" height="120"/>
    <rect x="790" y="480" width="360" height="120"/>

    <rect x="335" y="680" width="330" height="95"/>
    <rect x="790" y="680" width="360" height="95"/>

    <!-- The lower panel expands the ordinary S-file path from section 9.4. -->
    <rect x="20" y="825" width="1160" height="400"/>
    <rect x="40" y="945" width="260" height="85"/>
    <rect x="350" y="945" width="260" height="85"/>
    <rect x="680" y="945" width="260" height="85"/>
    <rect x="40" y="1090" width="260" height="100"/>
    <rect x="650" y="1090" width="260" height="100"/>
    <rect x="950" y="1090" width="210" height="100"/>
    <rect x="950" y="1250" width="210" height="90"/>
  </g>

  <!-- The device's MSI and the IOMMU's existing MRIF update/notice sequence. -->
  <path d="M 181,125 H 300 M 288,113 L 300,125 L 288,137" fill="none"
        stroke="#40ef00" stroke-width="5"/>
  <g fill="none" stroke="#cf9200" stroke-width="4.5">
    <path d="M 475,115 H 830 M 818,103 L 830,115 L 818,127"/>
    <path d="M 392.5,195 V 335 M 380.5,323 L 392.5,335 L 404.5,323"/>
  </g>

  <!-- This bidirectional dashed link represents the MRIF query reads. -->
  <path d="M 1115,175 V 480" fill="none" stroke="black"
        stroke-width="2.5" stroke-dasharray="6 6"/>
  <path d="M 1107,187 L 1115,175 L 1123,187 M 1107,468 L 1115,480 L 1123,468"
        fill="none" stroke="black" stroke-width="2.5"/>

  <g fill="none" stroke="black" stroke-width="3">
    <!-- No match: the existing S-file path uses its own backing and controls. -->
    <path d="M 335,385 H 145 V 470 M 137,458 L 145,470 L 153,458"/>

    <!-- Match: fork, with no dependency from the query engine to signaling. -->
    <path d="M 675,425 V 450 M 500,450 H 970 M 500,450 V 470 M 970,450 V 470"/>
    <path d="M 492,458 L 500,470 L 508,458 M 962,458 L 970,470 L 978,458"/>

    <path d="M 145,600 V 935 M 137,923 L 145,935 L 153,923"/>
    <path d="M 500,600 V 670 M 492,658 L 500,670 L 508,658"/>
    <path d="M 970,600 V 670 M 962,658 L 970,670 L 978,658"/>

    <!-- EN=0 retains native S-file backing; EN=1 writes its own MRIF. -->
    <path d="M 170,1030 V 1080 M 162,1068 L 170,1080 L 178,1068"/>
    <path d="M 300,987.5 H 340 M 328,979.5 L 340,987.5 L 328,995.5"/>
    <path d="M 610,987.5 H 670 M 658,979.5 L 670,987.5 L 658,995.5"/>

    <!-- S-file refresh starts after update visibility and the block 0 read. -->
    <path d="M 810,1030 V 1060 M 780,1060 H 1055 M 780,1060 V 1080 M 1055,1060 V 1080"/>
    <path d="M 772,1068 L 780,1080 L 788,1068 M 1047,1068 L 1055,1080 L 1063,1068"/>
    <path d="M 170,1190 V 1235 H 1055 M 1055,1190 V 1240 M 1047,1228 L 1055,1240 L 1063,1228"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="black" text-anchor="middle">
    <g font-size="24">
      <text x="97.5" y="132" font-size="22">PCIe device</text>
      <text x="392.5" y="120">IOMMU</text>
      <text x="990" y="122">Guest MRIF</text>
    </g>
    <g font-size="20">
      <text x="392.5" y="155" font-size="18">unchanged</text>
      <text x="990" y="153">EIP / EIE</text>
      <text x="980" y="267">Atomic 64-byte reads</text>
      <text x="600" y="331">S-file MMIO input</text>
      <text x="675" y="409" font-size="19">Matched notice: consume; do not set S-file pending</text>
      <text x="235" y="367">No match</text>
      <text x="727" y="489">parallel</text>
      <text x="727" y="515">paths</text>
      <text x="727" y="542" font-size="17">(independent)</text>
    </g>

    <g font-size="23">
      <text x="145" y="510" font-size="22">Ordinary S-file MSI</text>
      <text x="500" y="510">Signaling path</text>
      <text x="970" y="508">Query path</text>
    </g>
    <g font-size="20">
      <text x="145" y="542" font-size="18">MSI with EIID = NID</text>
      <text x="145" y="575" font-size="17">Continue below</text>
      <text x="500" y="542" font-size="21">Test eligible pending</text>
      <text x="970" y="535">Read block 0 / MAXBLK</text>
      <text x="970" y="560">Scan blocks 0..MAXBLK</text>
      <text x="970" y="585" font-size="19">Select top eligible interrupt</text>
    </g>

    <g font-size="22">
      <text x="500" y="712">VS external or</text>
      <text x="500" y="740">HS guest external</text>
      <text x="500" y="766" font-size="17">delivery controls apply</text>
      <text x="970" y="742" font-size="20">access waits for query</text>
      <text x="970" y="766" font-size="17">VGEIN=1 view</text>
    </g>

    <g font-size="19" text-anchor="start">
      <text x="170" y="800">Unmatched notice: EIID = NID</text>
      <text x="180" y="887">Other ordinary S-file MSIs also enter here.</text>
      <text x="180" y="914" font-size="18">Ignore 0 / unsupported identities; EN=1 also ignores identity 1.</text>
    </g>
    <g font-size="20">
      <text x="325" y="976" font-size="17">EN=1</text>
      <text x="225" y="1066" font-size="18">EN=0</text>
      <text x="480" y="973" fill="#b77d00">AMOOR S-file MRIF</text>
      <text x="480" y="1006" font-size="19">EIP[EIID], EIID &gt;= 2</text>
      <text x="810" y="973">Update visible; then</text>
      <text x="810" y="1006" font-size="19">read block 0 / MAXBLK</text>
      <text x="925" y="1080" font-size="18">parallel</text>
      <text x="170" y="1118" font-size="22">Native S-file path</text>
      <text x="170" y="1150" font-size="19">Existing backing</text>
      <text x="170" y="1178" font-size="19">and delivery controls</text>
      <text x="780" y="1118" font-size="19">Query blocks 0..MAXBLK</text>
      <text x="780" y="1149" font-size="19">Top eligible -&gt; stopei</text>
      <text x="780" y="1178" font-size="17">access waits if needed</text>
      <text x="1055" y="1118">Eligible pending?</text>
      <text x="1055" y="1178" font-size="17">No priority wait</text>
      <text x="1055" y="1280" font-size="22">HS external</text>
      <text x="1055" y="1308" font-size="22">interrupt</text>
      <text x="1055" y="1332" font-size="16">delivery controls apply</text>
    </g>

    <g font-family="Courier New, Courier, monospace">
      <text x="955" y="205" font-size="17">G.eimrifcfg.MRIFPPN &lt;&lt; 12</text>
      <text x="675" y="379" font-size="20">G.eimrifcfg.EN &amp;&amp; (NID == G.eimrifcfg.NID)?</text>
      <text x="500" y="577" font-size="25">hgeip[1]</text>
      <text x="970" y="714" font-size="23">Guest vstopei</text>
      <text x="170" y="994" font-size="21">S.eimrifcfg.EN?</text>
      <text x="1055" y="1152" font-size="25">SEIP</text>
    </g>

    <g font-size="24" font-weight="bold" text-anchor="start">
      <text x="805" y="57">Main memory</text>
      <text x="40" y="317">IMSIC (target hart)</text>
      <text x="335" y="858">IMSIC: S-file path (VGEIN=0; section 9.4)</text>
    </g>

    <g fill="#08bd00">
      <text x="242" y="87" font-size="19">MSI {EIID}</text>
      <text x="242" y="109" font-size="18">EIID &gt;= 2</text>
    </g>
    <g fill="#b77d00">
      <text x="635" y="96" font-size="22">1. AMOOR EIP[EIID]</text>
      <text x="600" y="236" font-size="22">2. Notice MSI {NID}</text>
      <text x="600" y="262" font-size="18">after MRIF update visible</text>
    </g>

    <text x="600" y="1385" font-size="20">G = guest register set (G1); S = S-file register set.</text>
    <text x="600" y="1415" font-size="18">Guest notice matching is independent of current VGEIN and precedes the S-file path.</text>
  </g>
</svg>
